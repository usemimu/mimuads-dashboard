<!DOCTYPE html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="frame-ancestors 'none'" />

    <!-- Primary meta. The SPA router (src/router/index.ts) updates title /
         description / robots / canonical per route; these are the first-paint
         and non-JS-crawler defaults (the signup "Get started" entry). -->
    <title>Get started with Mimuads | The infrastructure for physical ad buying</title>
    <meta
      name="description"
      content="Create your account and start buying on the infrastructure for physical advertising. Every DOOH screen, verified and programmatic. Self serve, no agency needed, live in a day."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#AE4828" />
    <meta name="application-name" content="Mimuads" />
    <link rel="canonical" href="https://ads.usemimu.com/signup" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Mimuads" />
    <meta property="og:title" content="Get started with Mimuads" />
    <meta
      property="og:description"
      content="Start buying on the infrastructure for physical advertising. Every DOOH screen, verified and programmatic. Self serve, no agency needed, live in a day."
    />
    <meta property="og:url" content="https://ads.usemimu.com/signup" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:image" content="https://usemimu.com/og-image.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@mimuads" />
    <meta name="twitter:title" content="Get started with Mimuads" />
    <meta
      name="twitter:description"
      content="Start buying on the infrastructure for physical advertising. Every DOOH screen, verified and programmatic. Self serve, no agency needed."
    />
    <meta name="twitter:image" content="https://usemimu.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..700&family=Space+Grotesk:wght@300..700&display=swap">
    <!-- Geist Mono (OFL, self-hosted) — money / metrics, above the fold. -->
    <link
      rel="preload"
      href="/fonts/GeistMono-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
